# Cloudflare Worker surumu (workers.dev icin).
# Pages dosyasi olan wrangler.toml'a dokunmaz.
name = "arapca-gorusme-formu"
main = "worker/index.js"
compatibility_date = "2026-11-01"

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "none"

# Pages ile ayni D1 veritabani. `wrangler d1 create` ciktisindaki id'yi yazin.
[[d1_databases]]
binding = "DB"
database_name = "gorusme-formu"
database_id = "d5b7dcea-7fb3-488b-abcc-ba1af3c89dff"
